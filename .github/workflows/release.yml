name: Deploy (Docker → VPS)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "ui/**"
      - "deploy/**"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ────────────────────────────────────────────────────────────
      - name: API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/api
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # ── UI image ─────────────────────────────────────────────────────────────
      - name: UI image metadata
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/ui
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    needs: deliver

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.API_IP }}
          username: ${{ secrets.API_USER }}
          password: ${{ secrets.API_SSH_PASSWORD }}
          script: |
            export GHCR_USERNAME=${{ github.actor }}
            export GHCR_PASSWORD=${{ secrets.GITHUB_TOKEN }}
            export GHCR_REGISTRY=${{ env.REGISTRY }}
            export GHCR_API_IMAGE=${{ env.REGISTRY }}/${{ env.REPO }}/api:latest
            export GHCR_UI_IMAGE=${{ env.REGISTRY }}/${{ env.REPO }}/ui:latest
            ~/deploy/deploy-7router.sh
